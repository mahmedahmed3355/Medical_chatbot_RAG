[project]
name = "medical-chatbot-rag"
version = "0.1.0"
description = "Medical chatbot RAG service with ML experiments and infrastructure tooling"
requires-python = ">=3.12"

dependencies = [
    "Flask==3.1.3",
    "langchain==1.3.16",
    "langchain-community==0.4.2",
    "langchain-huggingface==1.2.2",
    "langchain-groq==1.1.3",
    "faiss-cpu==1.15.0",
    "pypdf==6.16.2",
    "huggingface-hub==1.28.0",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "sentence-transformers==6.0.0",
    "transformers==5.15.1",
    "torch==2.13.0+cpu",
    "pydantic==2.13.4",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "prometheus-client",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
