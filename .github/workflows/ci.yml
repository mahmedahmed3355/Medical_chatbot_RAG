name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint, Type Check and Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Dependency integrity check
        run: python -m pip check

      - name: Run Ruff
        run: python -m ruff check app tests

      - name: Run mypy
        run: python -m mypy app

      - name: Run tests with coverage gate
        run: python -m pytest -q

      - name: Compile Python
        run: python -m compileall -q app tests

  security:
    name: Security and IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Dependency security audit
        run: python -m pip_audit -r requirements.lock

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Terraform format check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform initialize
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Install Checkov
        run: python -m pip install "checkov==3.3.13"

      - name: Run Checkov
        run: |
          python - <<'PY'
          from checkov.main import Checkov
          result = Checkov().run(["-d", "terraform", "--quiet"])
          raise SystemExit(0 if result is None else result)
          PY
