apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-rag-chatbot
  namespace: medical-rag
  labels:
    app: medical-rag-chatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medical-rag-chatbot
  template:
    metadata:
      labels:
        app: medical-rag-chatbot
    spec:
      containers:
        - name: medical-rag-chatbot
          image: medical-rag-chatbot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: medical-rag-config
                  key: PORT
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
